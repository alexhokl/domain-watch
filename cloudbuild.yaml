logsBucket: "gs://craffy-build-logs"

options:
  machineType: E2_HIGHCPU_8 # 8 vCPU
  logging: GCS_ONLY

timeout: "1200s" # 20 minutes

steps:
  # A tag-triggered build is the last chance to catch a regression before the
  # image is deployed, so the tests gate the build.
  - name: "golang:1.26"
    id: Test
    waitFor: ["-"]
    entrypoint: go
    args: ["test", "./..."]

  - name: "gcr.io/cloud-builders/docker"
    id: Build
    waitFor: [Test]
    args:
      - "build"
      - "-t"
      - "asia-east1-docker.pkg.dev/$PROJECT_ID/private/domain-watch:$TAG_NAME"
      - "-t"
      - "asia-east1-docker.pkg.dev/$PROJECT_ID/private/domain-watch:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: Push
    waitFor: [Build]
    args:
      - "push"
      - "--all-tags"
      - "asia-east1-docker.pkg.dev/$PROJECT_ID/private/domain-watch"
