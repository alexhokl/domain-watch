version: "3"

tasks:
  build:
    desc: Build
    cmds:
      - go build -o /dev/null ./...

  install:
    desc: Install
    cmd: go install

  test:
    desc: Run tests and write coverage.out
    cmds:
      - go test ./... -coverprofile=coverage.out -covermode=atomic

  coverage:
    desc: Run tests and print per-function coverage table
    cmds:
      - task: test
      - go tool cover -func=coverage.out

  clean:
    desc: Remove build artefacts
    cmds:
      - rm -f coverage.out domain-watch

  lint:
    desc: Lint
    cmds:
      - golangci-lint run

  sec:
    desc: Security check
    cmd: gosec ./...

  docker-build:
    desc: Build the container image locally
    cmd: docker build -t domain-watch:dev .

  tag:
    desc: Create a new git tag with incremented patch version (0.1.x)
    silent: true
    cmds:
      - |
        LATEST=$(git tag --sort=-version:refname | grep -E '^0\.1\.[0-9]+$' | head -1)
        PATCH=$(echo "$LATEST" | cut -d. -f3)
        if [ -z "$PATCH" ]; then PATCH=-1; fi
        NEW_TAG="0.1.$((PATCH + 1))"
        git tag "$NEW_TAG"
        echo "Created tag $NEW_TAG"
